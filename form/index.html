<!DOCTYPE html>
<meta charset="utf-8">

<html>
    <head>
        <title> FORM </title>
    </head>

    <body>
        <script>
            function  formSubmitted(event) {
                event.preventDefault();

                let studentIDControl = checkStudentID();

                console.log("Student ID Check Result: " + checkStudentID());

                if(studentIDControl === 1) {
                    alert("Student ID must be 9 digits!");
                } else if(studentIDControl === 2) {
                    alert("Student ID must be only numbers!");
                } else if(checkAge()) {
                    alert("Age and birthdate do not match!");
                } else if(checkName()) {
                    alert("Name must be filled!");
                } else {
                    let today = new Date();
                    alert("Form submitted successfully! Date: " + today.getDate() + " " + (today.getMonth() + 1) + " " + today.getFullYear());
                }
            }

            function checkAge() {
                console.log("Age is being checked...");
                let today = new Date();
                let dateWritten = new Date(document.getElementById("date").value);
                let yearWritten = dateWritten.getFullYear();
                if(document.getElementById("ageCall").value - "0" === today.getFullYear() - yearWritten) {
                    return 0;
                } else return 1;
            }

            function checkName() {
                console.log("Name is being checked");
                let name = document.getElementById("name").value;
                if(name === "")
                    return 1;
                else
                    return 0;
            }

            function checkStudentID() {
                console.log("Student ID is being checked.");
                let studentID = document.getElementById("id").value;

                if(isNaN(studentID)) {
                    return 2;
                } else if(studentID.length != 9) {
                    return 1;
                } else return 0;
            }
        </script>

        <form id="formID" onsubmit="formSubmitted(event)">
            <fieldset>
                <legend> FORM </legend>
                <div>
                    <label for="name"> Name & Surname </label>
                    <input id="name" placeholder="Username">
                </div>

                <div>
                    <label for="id"> Student ID </label>
                    <input id="id" placeholder="Student ID">
                </div>

                <div>
                    <label for="ageCall"> Age </label>
                    <input id="ageCall" type="number" name="age" value="0">
                </div>

                <div>
                    <label for="email"> Email </label>
                    <input type="email">
                </div>

                <div>
                    <label for="birthdate"> Birthdate </label>
                    <input id="date" type="date">
                </div>

                <div>
                    <label for="password"> Password </label>
                    <input type="password" placeholder="Password">
                </div>

                <div>
                    <label for="wellcheck"> I have read the assignment description well. </label>
                    <input type="checkbox">
                </div>

                <div>
                    <label for="wellcheck"> I asked my friends what to do. </label>
                    <input type="checkbox">
                </div>

                <div>
                    <label for="wellcheck"> I have read the assignment description well. </label>
                    <input type="radio" name="read">
                </div>

                <div>
                    <label for="wellcheck"> I asked my friends to what to do. </label>
                    <input type="radio" name="read">
                </div>

                <div>
                    <label for = "textarea"> Others </label>
                    <textarea></textarea>
                </div>

                <button type="reset"> Reset </button>
                <button type="submit"> Submit </button>
            </fieldset>
        </form>
    </body>
</html>
